<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif">
  <title>STM32F746G-Discovery as a USB GUD display</title>
  <rect width="900" height="440" rx="12" fill="#f6f8fa"/>

  <!-- Board -->
  <rect x="30" y="40" width="470" height="340" rx="14" fill="#1f2328"/>
  <rect x="38" y="48" width="454" height="324" rx="10" fill="none" stroke="#3a4048" stroke-width="2"/>
  <circle cx="54" cy="64" r="6" fill="#57606a"/>
  <circle cx="476" cy="64" r="6" fill="#57606a"/>
  <circle cx="54" cy="356" r="6" fill="#57606a"/>
  <circle cx="476" cy="356" r="6" fill="#57606a"/>
  <text x="265" y="70" text-anchor="middle" font-size="13" fill="#c9d1d9">STM32F746G-DISCO</text>

  <!-- LCD, 480x272, showing the splash screen of the firmware -->
  <g transform="translate(-14,0)">
    <rect x="73" y="86" width="384" height="230" rx="4" fill="#0d1117"/>
    <rect x="81" y="94" width="368" height="209" fill="#ffffff"/>
    <rect x="81" y="94" width="368" height="61" fill="#000080"/>
    <text x="265" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">USB GUD Display</text>
    <text x="265" y="145" text-anchor="middle" font-size="12" fill="#ffffff">USB HS, connector CN12</text>
    <text x="265" y="210" text-anchor="middle" font-size="14" fill="#000080">Waiting for the host</text>
    <text x="265" y="232" text-anchor="middle" font-size="10" fill="#000080">480x272 RGB565, Linux gud driver</text>
    <text x="265" y="334" text-anchor="middle" font-size="11" fill="#8b949e">4.3" LCD, LTDC + DMA2D, frame buffer in SDRAM</text>
  </g>

  <!-- Connectors on the board edge -->
  <g font-size="12" font-weight="bold">
    <rect x="500" y="98" width="26" height="30" rx="3" fill="#d0d7de" stroke="#57606a"/>
    <text x="490" y="118" text-anchor="end" fill="#c9d1d9">CN14</text>
    <rect x="500" y="193" width="26" height="30" rx="3" fill="#d0d7de" stroke="#57606a"/>
    <text x="490" y="213" text-anchor="end" fill="#c9d1d9">CN12</text>
    <rect x="500" y="288" width="26" height="30" rx="3" fill="#d0d7de" stroke="#57606a"/>
    <text x="490" y="308" text-anchor="end" fill="#c9d1d9">CN13</text>
  </g>

  <!-- Cables -->
  <path d="M526 113 C600 113 620 120 700 120" fill="none" stroke="#0969da" stroke-width="5"/>
  <path d="M526 208 C600 208 620 210 700 210" fill="none" stroke="#1a7f37" stroke-width="5"/>
  <path d="M526 303 C600 303 620 300 700 300" fill="none" stroke="#1a7f37" stroke-width="5" stroke-dasharray="10 7"/>

  <g font-size="12" fill="#1f2328">
    <text x="540" y="96">ST-LINK: program, log</text>
    <text x="540" y="191">USB HS: the display</text>
    <text x="540" y="286">USB FS: the display</text>
    <text x="540" y="336" fill="#57606a">(make USB=FS)</text>
  </g>

  <!-- Linux host -->
  <rect x="700" y="80" width="170" height="260" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="785" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2328">Linux PC</text>
  <g font-size="11" fill="#1f2328" font-family="Menlo, Consolas, monospace">
    <text x="714" y="140">/dev/ttyACM0</text>
    <text x="714" y="156" fill="#57606a">openocd</text>
    <text x="714" y="210">1d50:614d</text>
    <text x="714" y="226">gud driver</text>
    <text x="714" y="242">/dev/dri/cardN</text>
    <text x="714" y="258">/dev/fbN</text>
  </g>
  <text x="785" y="320" text-anchor="middle" font-size="10" fill="#57606a">one display cable, CN12 or CN13</text>

  <text x="30" y="414" font-size="11" fill="#57606a">Illustration, not to scale. The LCD shows the splash screen the firmware draws until the host switches the display on.</text>
</svg>
